# Records live data as `npm run record` does, for audits such as #233's: Renfe's feeds, the day's
# bundle, and production snapshots as the map receives them, so that nobody has to be at a computer
# for it. It runs from the button in the Actions tab, for as many minutes as asked, or on a
# schedule added for an audit's recordings (a cron names no year: take it out once it has run).
# Each run keeps its recording as an artifact for 90 days, the most Actions allows, named for when
# it started in Barcelona: `gh run download <run id>` fetches it. A longer-lived copy of one an
# audit leans on is #414's. GitHub can start a scheduled run hours late, and under heavy
# load not at all, so check the runs afterwards and dispatch one by hand if need be.
name: Record

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: How many minutes to record
        type: number
        default: 45

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    # Up to about 100 minutes' recording, and the minute it takes to cut the bundle down after it.
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # It needs no packages, and no secrets: Renfe's feeds, the bundles and the snapshot are public.
      - id: started
        run: echo "name=recording-$(TZ=Europe/Madrid date +%Y-%m-%d-%H%M)" >> "$GITHUB_OUTPUT"
      - run: npm run record -- recording "$MINUTES"
        env:
          MINUTES: ${{ inputs.minutes || 45 }}
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.started.outputs.name }}
          path: recording/
          retention-days: 90
